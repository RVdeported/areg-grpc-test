# =============================================================================
# AREG vs gRPC Benchmark Configuration
# =============================================================================
# All paths support ~ expansion.  Relative paths are resolved from the repo dir.

[paths]
# Local repository root
repo_dir = .
# Where to store benchmark output CSVs
results_dir = results

[remote]
# SSH host for launching clients (leave host empty for local-only mode)
host =
# SSH user (optional — uses ssh config default if empty)
user =
# SSH port (default: 22)
port = 22
# Repository root on the remote machine
repo_dir = .

[server]
# Bind address for the server (0.0.0.0 = all interfaces)
bind_address = 0.0.0.0
# Port for gRPC server
grpc_port = 50000
# Port for AREG message router
areg_port = 8182
# Seconds to wait for server startup before launching clients
startup_wait = 3

[benchmark]
# Comma-separated transports to test: areg, grpc (or both)
transports = areg, grpc
# Comma-separated list of client/worker counts to test
client_counts = 1, 2, 4, 8, 16, 32, 64, 128
# Number of tasks in the shared task file (one file reused for all runs)
total_tasks = 1000
# Matrix dimension bounds (uniform random in [dim_lower, dim_upper])
dim_lower = 5
dim_upper = 20
